<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Tech NOLA reservations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fa;font:18px/1.6 system-ui,sans-serif}main{max-width:700px;margin:8vh auto;padding:32px}small{color:#54e0c4;letter-spacing:.12em}h1{font-size:clamp(30px,5vw,46px);line-height:1.15}#count{font-size:25px}label{display:block;margin:22px 0 8px}input,button{font:inherit;padding:12px 16px;border-radius:6px;width:100%}input{border:1px solid #99a7b8;background:#fff;color:#101827}button{margin-top:28px;background:#54e0c4;color:#101827;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#result{min-height:64px;padding-top:16px}footer{font-size:14px;color:#b8c4d4;margin-top:40px}
</style></head><body><main><small>BLACK TECH NOLA · WORKSHOP</small>
<h1 id="resource">Reserve your place</h1><p id="count">Loading availability…</p>
<form id="reservation"><label for="name">Your name</label><input id="name" name="name" required maxlength="80" placeholder="Enter your name">
<label for="quantity">Seats to reserve</label><input id="quantity" name="quantity" type="number" min="1" step="1" required value="1">
<button id="submit">Reserve seats</button></form><p id="result" role="status" aria-live="polite"></p>
<footer>Local workshop demo. Reservations stay in memory. Restart the server to begin again.</footer>
<script type="module">
const count = document.querySelector('#count');
const result = document.querySelector('#result');
const button = document.querySelector('#submit');
function showCount(n) { count.textContent = `${n} seat${n === 1 ? '' : 's'} available`; }
async function refresh() {
 const response = await fetch('/api/availability');
 if (!response.ok) throw new Error('Could not load availability.');
 const data = await response.json();
 document.querySelector('#resource').textContent = data.resource;
 showCount(data.available);
}
document.querySelector('form').addEventListener('submit', async event => {
 event.preventDefault(); button.disabled = true;
 try {
  const response = await fetch('/api/reservations', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:document.querySelector('#name').value,quantity:Number(document.querySelector('#quantity').value)})});
  const data = await response.json(); result.textContent = data.message;
  if (typeof data.available === 'number') showCount(data.available);
 } catch { result.textContent = 'Could not reach the app. Check that the server is running.'; }
 finally { button.disabled = false; }
});
refresh().catch(error => { result.textContent = error.message; });
</script></main></body></html>
